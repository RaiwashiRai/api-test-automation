name: CI Pipeline

on:
  workflow_dispatch:   # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests only
        run: mvn test -DskipTests=false -B   # -B for batch mode, less console noise

      # Optional: only keep summary to reduce artifact size
      - name: Save test summary
        if: always()
        run: |
          mkdir -p test-summary
          grep -E "Tests run|Failures|Errors|Skipped" target/surefire-reports/*.txt > test-summary/summary.txt
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary/
          retention-days: 7